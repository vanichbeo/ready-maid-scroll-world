name: Auto SEO Deterministic Worker

on:
  workflow_dispatch:
    inputs:
      fault_stage:
        description: Manual-only recovery test fault point
        required: false
        default: none
        type: choice
        options:
          - none
          - after_change_prepared
          - after_pr_created
          - during_ci
          - after_merge
          - before_reconcile
  push:
    branches: [main]
    paths:
      - '.github/workflows/seo-deterministic-worker.yml'

permissions:
  id-token: write
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: auto-seo-deterministic-worker
  cancel-in-progress: false

jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      REPO: vanichbeo/ready-maid-scroll-world
      BROKER_URL: https://mgefvmzxfjqgtnpfgqgm.supabase.co/functions/v1/seo-github-worker-broker
      OIDC_AUD: readymaid-seo-worker
      GH_TOKEN: ${{ github.token }}
      FAULT_STAGE: ${{ github.event_name == 'workflow_dispatch' && inputs.fault_stage || 'none' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Lease today's server-side SEO action
        id: lease
        shell: bash
        run: |
          set -euo pipefail
          TOKEN=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${OIDC_AUD}" | python -c 'import json,sys; print(json.load(sys.stdin)["value"])')
          curl -fsS -X POST "$BROKER_URL" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"action":"lease"}' > /tmp/seo-lease.json
          cat /tmp/seo-lease.json
          python - <<'PY'
          import json, os
          d=json.load(open('/tmp/seo-lease.json'))
          stages={x.get('stage_name'):x for x in d.get('stages',[])}
          out=os.environ['GITHUB_OUTPUT']
          with open(out,'a') as f:
              f.write(f"run_id={d.get('run_id','')}\n")
              f.write(f"run_date={d.get('run_date','')}\n")
              f.write(f"attempt_no={d.get('attempt_no',1)}\n")
              f.write(f"resume_from={d.get('resume_from','change_prepared')}\n")
              for s in ['change_prepared','qa_passed','branch_created','pr_created','ci_passed','merged','deployment_ready','live_verified','reconciled']:
                  f.write(f"{s}_done={'true' if stages.get(s,{}).get('status')=='completed' else 'false'}\n")
              active = bool(d.get('ok')) and not bool(d.get('terminal')) and d.get('action') in ('RELINK','UPDATE')
              f.write(f"active={'true' if active else 'false'}\n")
          PY

      - name: Recover durable and remote GitHub evidence
        if: steps.lease.outputs.active == 'true'
        id: recover
        shell: bash
        run: |
          set -euo pipefail
          RUN8=$(echo "${{ steps.lease.outputs.run_id }}" | cut -c1-8)
          BRANCH="seo-auto-${RUN8}"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

          python - <<'PY'
          import json
          d=json.load(open('/tmp/seo-lease.json'))
          stages={x.get('stage_name'):x for x in d.get('stages',[])}
          wr=(stages.get('change_prepared',{}).get('evidence') or {}).get('worker_result')
          if wr:
              open('/tmp/seo-worker-result.json','w').write(json.dumps(wr,indent=2)+'\n')
          PY

          TOKEN=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${OIDC_AUD}" | python -c 'import json,sys; print(json.load(sys.stdin)["value"])')
          checkpoint() {
            curl -fsS -X POST "$BROKER_URL" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" --data "$1"
          }

          BRANCH_EXISTS=false
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            BRANCH_EXISTS=true
            git fetch origin "$BRANCH"
            git checkout -B "$BRANCH" "origin/$BRANCH"
            PAYLOAD=$(python - <<PY
          import json
          print(json.dumps({"action":"checkpoint","run_id":"${{ steps.lease.outputs.run_id }}","stage":"branch_created","status":"completed","branch_name":"$BRANCH","evidence":{"recovered_from_remote":True}}))
          PY
          )
            checkpoint "$PAYLOAD"
          fi
          echo "branch_exists=$BRANCH_EXISTS" >> "$GITHUB_OUTPUT"

          PR_NUMBER=$(gh pr list --repo "$REPO" --head "$BRANCH" --state all --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$PR_NUMBER" ]; then
            echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
            PAYLOAD=$(python - <<PY
          import json
          print(json.dumps({"action":"checkpoint","run_id":"${{ steps.lease.outputs.run_id }}","stage":"pr_created","status":"completed","branch_name":"$BRANCH","pr_number":int("$PR_NUMBER"),"evidence":{"recovered_from_remote":True}}))
          PY
          )
            checkpoint "$PAYLOAD"
            MERGED_AT=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json mergedAt --jq '.mergedAt // empty')
            if [ -n "$MERGED_AT" ]; then
              MERGE_SHA=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json mergeCommit --jq '.mergeCommit.oid')
              echo "merge_sha=$MERGE_SHA" >> "$GITHUB_OUTPUT"
              PAYLOAD=$(python - <<PY
          import json
          print(json.dumps({"action":"checkpoint","run_id":"${{ steps.lease.outputs.run_id }}","stage":"merged","status":"completed","pr_number":int("$PR_NUMBER"),"commit_sha":"$MERGE_SHA","evidence":{"recovered_from_remote":True}}))
          PY
          )
              checkpoint "$PAYLOAD"
            fi
          fi

          if [ -f /tmp/seo-worker-result.json ]; then echo "has_result=true" >> "$GITHUB_OUTPUT"; else echo "has_result=false" >> "$GITHUB_OUTPUT"; fi

      - name: Prepare one deterministic SEO change
        if: steps.lease.outputs.active == 'true' && steps.recover.outputs.has_result != 'true'
        shell: bash
        run: |
          set -euo pipefail
          trap 'echo "{\"class\":\"TRANSIENT\",\"stage\":\"change_prepared\",\"message\":\"change preparation failed\"}" > /tmp/failure.json' ERR
          node scripts/seo-deterministic-worker.mjs --lease /tmp/seo-lease.json --out /tmp/seo-worker-result.json
          ACTION=$(python -c 'import json; print(json.load(open("/tmp/seo-worker-result.json")).get("action",""))')
          CHANGED=$(git status --porcelain | wc -l | tr -d ' ')
          if [ "$ACTION" = "CREATE" ]; then
            test "$CHANGED" = "3"
            python scripts/seo_surface_sync.py --check
          else
            test "$CHANGED" = "1"
          fi
          git diff --check
          INPUT_HASH=$(sha256sum /tmp/seo-lease.json | awk '{print $1}')
          OUTPUT_HASH=$(sha256sum /tmp/seo-worker-result.json | awk '{print $1}')
          TOKEN=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${OIDC_AUD}" | python -c 'import json,sys; print(json.load(sys.stdin)["value"])')
          python - <<PY >/tmp/stage.json
          import json
          wr=json.load(open('/tmp/seo-worker-result.json'))
          print(json.dumps({"action":"checkpoint","run_id":"${{ steps.lease.outputs.run_id }}","stage":"change_prepared","status":"completed","input_hash":"$INPUT_HASH","output_hash":"$OUTPUT_HASH","evidence":{"worker_result":wr}}))
          PY
          curl -fsS -X POST "$BROKER_URL" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" --data-binary @/tmp/stage.json
          cat /tmp/seo-worker-result.json
          if [ "$FAULT_STAGE" = "after_change_prepared" ]; then
            echo '{"class":"TRANSIENT","stage":"change_prepared","message":"controlled fault injection after change_prepared"}' > /tmp/failure.json
            exit 97
          fi

      - name: Run all production safety gates locally
        if: steps.lease.outputs.active == 'true' && steps.lease.outputs.qa_passed_done != 'true'
        shell: bash
        run: |
          set -euo pipefail
          trap 'echo "{\"class\":\"HARD_BLOCK\",\"stage\":\"qa_passed\",\"message\":\"production safety gate failed\"}" > /tmp/failure.json' ERR
          node scripts/vercel-seo-guard.mjs --self-test
          node scripts/vercel-seo-guard.mjs --ci
          node scripts/seo-site-audit.mjs
          python scripts/seo_surface_sync.py --check
          node scripts/check-duke-media.mjs
          TOKEN=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${OIDC_AUD}" | python -c 'import json,sys; print(json.load(sys.stdin)["value"])')
          curl -fsS -X POST "$BROKER_URL" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            --data '{"action":"checkpoint","run_id":"${{ steps.lease.outputs.run_id }}","stage":"qa_passed","status":"completed","evidence":{"all_local_safety_gates":true}}'

      - name: Create or recover isolated branch and pull request
        if: steps.lease.outputs.active == 'true'
        id: pr
        shell: bash
        run: |
          set -euo pipefail
          trap 'echo "{\"class\":\"TRANSIENT\",\"stage\":\"pr_created\",\"message\":\"branch or pull request operation failed\"}" > /tmp/failure.json' ERR
          BRANCH="${{ steps.recover.outputs.branch }}"
          git config user.name "readymaid-seo-worker"
          git config user.email "readymaid-seo-worker@users.noreply.github.com"
          TOKEN=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${OIDC_AUD}" | python -c 'import json,sys; print(json.load(sys.stdin)["value"])')

          if ! git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            git checkout -b "$BRANCH"
            git add -A
            ACTION=$(python -c 'import json; print(json.load(open("/tmp/seo-worker-result.json")).get("action","SEO"))')
            git commit -m "seo(auto): deterministic ${ACTION,,}"
            COMMIT_SHA=$(git rev-parse HEAD)
            git push origin "$BRANCH"
            python - <<PY >/tmp/branch-stage.json
          import json
          print(json.dumps({"action":"checkpoint","run_id":"${{ steps.lease.outputs.run_id }}","stage":"branch_created","status":"completed","branch_name":"$BRANCH","commit_sha":"$COMMIT_SHA","evidence":{"remote_verified":True}}))
          PY
            curl -fsS -X POST "$BROKER_URL" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" --data-binary @/tmp/branch-stage.json
          else
            git fetch origin "$BRANCH"
            git checkout -B "$BRANCH" "origin/$BRANCH"
          fi

          PR_NUMBER=$(gh pr list --repo "$REPO" --head "$BRANCH" --state all --limit 1 --json number --jq '.[0].number // empty')
          if [ -z "$PR_NUMBER" ]; then
            ACTION=$(python -c 'import json; print(json.load(open("/tmp/seo-worker-result.json")).get("action","SEO"))')
            python - <<PY >/tmp/create-pr.json
          import json
          print(json.dumps({
            "action":"create_pr",
            "run_id":"${{ steps.lease.outputs.run_id }}",
            "branch_name":"$BRANCH",
            "title":"SEO auto: deterministic $ACTION",
            "body":"Server-side Auto SEO deterministic $ACTION with exact-stage recovery. One content file only; all production safety gates and reconciliation gates remain mandatory."
          }))
          PY
            HTTP_CODE=$(curl -sS -o /tmp/create-pr-response.json -w '%{http_code}' -X POST "$BROKER_URL" \
              -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" --data-binary @/tmp/create-pr.json)
            if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
              python - <<'PY' >/tmp/failure.json
          import json
          from pathlib import Path
          raw=Path('/tmp/create-pr-response.json').read_text(errors='replace').strip()
          try:
              d=json.loads(raw)
              err=str(d.get("external_error") or d.get("error") or raw)
          except Exception:
              err=raw
          print(json.dumps({
            "class":"TRANSIENT",
            "stage":"pr_created",
            "message":"Broker-authenticated GitHub PR creation failed",
            "external_error":err[-4000:]
          }))
          PY
              cat /tmp/create-pr-response.json >&2 || true
              exit 1
            fi
            PR_NUMBER=$(python -c 'import json; print(json.load(open("/tmp/create-pr-response.json"))["pr_number"])')
          fi
          python - <<PY >/tmp/pr-stage.json
          import json
          print(json.dumps({"action":"checkpoint","run_id":"${{ steps.lease.outputs.run_id }}","stage":"pr_created","status":"completed","branch_name":"$BRANCH","pr_number":int("$PR_NUMBER"),"evidence":{"remote_verified":True}}))
          PY
          curl -fsS -X POST "$BROKER_URL" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" --data-binary @/tmp/pr-stage.json
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          if [ "$FAULT_STAGE" = "after_pr_created" ]; then
            echo '{"class":"TRANSIENT","stage":"pr_created","message":"controlled fault injection after pr_created"}' > /tmp/failure.json
            exit 97
          fi

      - name: Run or recover independent SEO Production Gate
        if: steps.lease.outputs.active == 'true'
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          BRANCH="${{ steps.pr.outputs.branch }}"
          TOKEN=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${OIDC_AUD}" | python -c 'import json,sys; print(json.load(sys.stdin)["value"])')

          HEAD_SHA=$(git ls-remote origin "refs/heads/$BRANCH" | awk '{print $1}')
          test -n "$HEAD_SHA"
          RUN_ID=$(gh run list --repo "$REPO" --workflow seo-production-gate.yml --branch "$BRANCH" \
            --event workflow_dispatch --limit 20 --json databaseId,headSha \
            --jq 'map(select(.headSha == "'"$HEAD_SHA"'")) | .[0].databaseId // empty')

          if [ -z "$RUN_ID" ]; then
            gh workflow run seo-production-gate.yml --repo "$REPO" --ref "$BRANCH"
            for i in {1..30}; do
              RUN_ID=$(gh run list --repo "$REPO" --workflow seo-production-gate.yml --branch "$BRANCH" \
                --event workflow_dispatch --limit 20 --json databaseId,headSha \
                --jq 'map(select(.headSha == "'"$HEAD_SHA"'")) | .[0].databaseId // empty')
              [ -n "$RUN_ID" ] && break
              sleep 5
            done
          fi
          [ -n "$RUN_ID" ]
          echo "gate_run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          if [ "$FAULT_STAGE" = "during_ci" ]; then
            echo '{"class":"WAITING_EXTERNAL","stage":"ci_passed","message":"controlled fault injection while CI is external/pending"}' > /tmp/failure.json
            exit 97
          fi

          for i in {1..60}; do
            STATUS=$(gh run view "$RUN_ID" --repo "$REPO" --json status --jq .status)
            if [ "$STATUS" = "completed" ]; then
              CONCLUSION=$(gh run view "$RUN_ID" --repo "$REPO" --json conclusion --jq .conclusion)
              if [ "$CONCLUSION" != "success" ]; then
                echo '{"class":"HARD_BLOCK","stage":"ci_passed","message":"independent SEO Production Gate failed"}' > /tmp/failure.json
                exit 1
              fi
              python - <<PY >/tmp/ci-stage.json
          import json
          print(json.dumps({"action":"checkpoint","run_id":"${{ steps.lease.outputs.run_id }}","stage":"ci_passed","status":"completed","external_run_id":"$RUN_ID","evidence":{"conclusion":"success","remote_verified":True}}))
          PY
              curl -fsS -X POST "$BROKER_URL" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" --data-binary @/tmp/ci-stage.json
              exit 0
            fi
            sleep 10
          done
          echo '{"class":"WAITING_EXTERNAL","stage":"ci_passed","message":"CI still pending after worker wait window"}' > /tmp/failure.json
          exit 1

      - name: Merge once or recover existing merge
        if: steps.lease.outputs.active == 'true'
        id: merge
        shell: bash
        run: |
          set -euo pipefail
          trap 'echo "{\"class\":\"TRANSIENT\",\"stage\":\"merged\",\"message\":\"merge verification failed\"}" > /tmp/failure.json' ERR
          PR="${{ steps.pr.outputs.pr_number }}"
          MERGED_AT=$(gh pr view "$PR" --repo "$REPO" --json mergedAt --jq '.mergedAt // empty')
          if [ -z "$MERGED_AT" ]; then
            gh pr merge "$PR" --repo "$REPO" --squash --delete-branch
          fi
          MERGE_SHA=$(gh pr view "$PR" --repo "$REPO" --json mergeCommit --jq '.mergeCommit.oid')
          test -n "$MERGE_SHA"
          TOKEN=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${OIDC_AUD}" | python -c 'import json,sys; print(json.load(sys.stdin)["value"])')
          python - <<PY >/tmp/merge-stage.json
          import json
          print(json.dumps({"action":"checkpoint","run_id":"${{ steps.lease.outputs.run_id }}","stage":"merged","status":"completed","pr_number":int("$PR"),"commit_sha":"$MERGE_SHA","evidence":{"remote_verified":True}}))
          PY
          curl -fsS -X POST "$BROKER_URL" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" --data-binary @/tmp/merge-stage.json
          echo "merge_sha=$MERGE_SHA" >> "$GITHUB_OUTPUT"
          if [ "$FAULT_STAGE" = "after_merge" ]; then
            echo '{"class":"TRANSIENT","stage":"merged","message":"controlled fault injection after merge"}' > /tmp/failure.json
            exit 97
          fi

      - name: Verify deployment and live production without republishing
        if: steps.lease.outputs.active == 'true'
        id: live
        shell: bash
        run: |
          set -euo pipefail
          SOURCE=$(python -c 'import json; d=json.load(open("/tmp/seo-worker-result.json")); print(d.get("source_url") or d["target_url"])')
          TARGET=$(python -c 'import json; print(json.load(open("/tmp/seo-worker-result.json"))["target_url"])')
          TOKEN=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${OIDC_AUD}" | python -c 'import json,sys; print(json.load(sys.stdin)["value"])')

          MERGE_SHA="${{ steps.merge.outputs.merge_sha }}"
          DEPLOYMENT_ID=""
          DEPLOYMENT_URL=""

          # Authoritative deployment identity gate: require the successful
          # production deployment recorded by the Vercel GitHub integration
          # to belong to this exact merge SHA before live verification.
          for i in {1..45}; do
            DEPLOYMENTS=$(gh api --method GET "repos/$REPO/deployments?sha=$MERGE_SHA&per_page=50")
            DEPLOYMENT_ID=$(echo "$DEPLOYMENTS" | jq -r '
              [.[] | select(((.environment // "") | ascii_downcase) == "production")]
              | sort_by(.created_at) | last | .id // empty
            ')
            if [ -n "$DEPLOYMENT_ID" ]; then
              STATUSES=$(gh api --method GET "repos/$REPO/deployments/$DEPLOYMENT_ID/statuses?per_page=50")
              DEPLOYMENT_URL=$(echo "$STATUSES" | jq -r '
                [.[] | select(.state == "success")] | sort_by(.created_at) | last
                | (.environment_url // .target_url // empty)
              ')
              [ -n "$DEPLOYMENT_URL" ] && break
            fi
            sleep 15
          done

          if [ -z "$DEPLOYMENT_ID" ] || [ -z "$DEPLOYMENT_URL" ]; then
            echo '{"class":"WAITING_EXTERNAL","stage":"deployment_ready","message":"no successful production deployment found for exact merge SHA"}' > /tmp/failure.json
            exit 1
          fi

          python - <<PY >/tmp/deploy-stage.json
          import json
          print(json.dumps({
            "action":"checkpoint",
            "run_id":"${{ steps.lease.outputs.run_id }}",
            "stage":"deployment_ready",
            "status":"completed",
            "commit_sha":"$MERGE_SHA",
            "deployment_id":"$DEPLOYMENT_ID",
            "evidence":{
              "provider":"vercel_github_deployment",
              "production_environment":True,
              "exact_merge_sha_verified":True,
              "deployment_url":"$DEPLOYMENT_URL"
            }
          }))
          PY
          curl -fsS -X POST "$BROKER_URL" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" --data-binary @/tmp/deploy-stage.json

          ACTION=$(python -c 'import json; print(json.load(open("/tmp/seo-worker-result.json")).get("action",""))')
          for i in {1..45}; do
            curl -fsS "https://readymaid.my${SOURCE}" > /tmp/live-page.html || true
            LIVE_OK=false

            if [ "$ACTION" = "RELINK" ]; then
              if grep -F "href=\"${TARGET}\"" /tmp/live-page.html >/dev/null; then
                LIVE_OK=true
              fi
            elif [ "$ACTION" = "UPDATE" ]; then
              python - <<'PY' && LIVE_OK=true || LIVE_OK=false
          import html, json, re, sys
          x=json.load(open('/tmp/seo-worker-result.json'))
          page=open('/tmp/live-page.html',encoding='utf-8').read()
          title=x.get('expected_title')
          desc=x.get('expected_meta_description')
          if title:
              m=re.search(r'<title>(.*?)</title>',page,re.I|re.S)
              if not m or html.unescape(re.sub(r'\s+',' ',m.group(1))).strip()!=title:
                  sys.exit(1)
          if desc:
              found=None
              for tag in re.findall(r'<meta\b[^>]*>',page,re.I):
                  attrs={k.lower():v for k,_,v in re.findall(r'([:\w-]+)\s*=\s*(["\'])(.*?)\2',tag,re.I|re.S)}
                  if attrs.get('name','').lower()=='description':
                      found=html.unescape(attrs.get('content','')).strip()
                      break
              if found!=desc:
                  sys.exit(1)
          sys.exit(0)
          PY
            elif [ "$ACTION" = "CREATE" ]; then
              python - <<'PY' && LIVE_OK=true || LIVE_OK=false
          import html, json, re, sys
          x=json.load(open('/tmp/seo-worker-result.json'))
          page=open('/tmp/live-page.html',encoding='utf-8').read()
          def text_between(pattern):
              m=re.search(pattern,page,re.I|re.S)
              return html.unescape(re.sub(r'\s+',' ',m.group(1))).strip() if m else None
          if text_between(r'<title>(.*?)</title>') != x.get('expected_title'):
              sys.exit(1)
          if text_between(r'<h1[^>]*>(.*?)</h1>') != x.get('expected_h1'):
              sys.exit(1)
          found=None
          for tag in re.findall(r'<meta\b[^>]*>',page,re.I):
              attrs={k.lower():v for k,_,v in re.findall(r'([:\w-]+)\s*=\s*(["\'])(.*?)\2',tag,re.I|re.S)}
              if attrs.get('name','').lower()=='description':
                  found=html.unescape(attrs.get('content','')).strip()
                  break
          if found != x.get('expected_meta_description'):
              sys.exit(1)
          if f'href="{x.get("expected_cta_target")}"' not in page:
              sys.exit(1)
          sys.exit(0)
          PY
            fi

            if [ "$LIVE_OK" = "true" ]; then
              python - <<PY >/tmp/live-stage.json
          import json
          x=json.load(open('/tmp/seo-worker-result.json'))
          print(json.dumps({
            "action":"checkpoint",
            "run_id":"${{ steps.lease.outputs.run_id }}",
            "stage":"live_verified",
            "status":"completed",
            "commit_sha":"$MERGE_SHA",
            "deployment_id":"$DEPLOYMENT_ID",
            "evidence":{
              "source_url":"$SOURCE",
              "target_url":"$TARGET",
              "verify_kind":x.get("verify_kind"),
              "expected_link_present":x.get("action")=="RELINK",
              "update_verified":x.get("action")=="UPDATE",
              "create_verified":x.get("action")=="CREATE",
              "expected_title":x.get("expected_title"),
              "expected_meta_description":x.get("expected_meta_description"),
              "expected_h1":x.get("expected_h1"),
              "expected_cta_target":x.get("expected_cta_target"),
              "contract_hash":x.get("contract_hash"),
              "output_sha256":x.get("output_sha256"),
              "deployment_url":"$DEPLOYMENT_URL",
              "exact_merge_sha_verified":True
            }
          }))
          PY
              curl -fsS -X POST "$BROKER_URL" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" --data-binary @/tmp/live-stage.json
              touch /tmp/live-verified
              echo "deployment_id=$DEPLOYMENT_ID" >> "$GITHUB_OUTPUT"
              echo "deployment_url=$DEPLOYMENT_URL" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 15
          done
          echo '{"class":"WAITING_EXTERNAL","stage":"live_verified","message":"exact-SHA production deployment exists but expected live change is not yet observable"}' > /tmp/failure.json
          exit 1

      - name: Controlled fault before final reconciliation
        if: steps.lease.outputs.active == 'true' && env.FAULT_STAGE == 'before_reconcile'
        shell: bash
        run: |
          set -euo pipefail
          echo '{"class":"TRANSIENT","stage":"reconciled","message":"controlled fault injection before reconciliation"}' > /tmp/failure.json
          exit 97

      - name: Reconcile PASS into the same Supabase run
        if: steps.lease.outputs.active == 'true'
        shell: bash
        run: |
          set -euo pipefail
          TOKEN=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN"             "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${OIDC_AUD}" | python -c 'import json,sys; print(json.load(sys.stdin)["value"])')
          TARGET=$(python -c 'import json; print(json.load(open("/tmp/seo-worker-result.json"))["target_url"])')
          SITEMAP_URL="https://readymaid.my/sitemap.xml"
          SITEMAP_CANONICAL="https://readymaid.my${TARGET}"
          SITEMAP_REQUIRED=$(python -c 'import json; d=json.load(open("/tmp/seo-lease.json")); print("true" if d.get("target_in_sitemap") is True else "false")')
          SITEMAP_VERIFIED=false
          if [ "$SITEMAP_REQUIRED" = "true" ]; then
            if ! curl -fsS "$SITEMAP_URL" | grep -F "<loc>${SITEMAP_CANONICAL}</loc>" >/dev/null; then
              echo '{"class":"INCONSISTENT","stage":"reconciled","message":"live sitemap is stale or missing the reconciled target URL"}' > /tmp/failure.json
              exit 1
            fi
            SITEMAP_VERIFIED=true
          fi
          export SITEMAP_REQUIRED SITEMAP_VERIFIED

          python - <<'PY' >/tmp/finalize.json
          import json, os
          x=json.load(open('/tmp/seo-worker-result.json'))
          payload={
            "action":"finalize",
            "run_id":"${{ steps.lease.outputs.run_id }}",
            "result":"passed",
            "evidence":{
              "static_qa":True,
              "protected_surface_ok":True,
              "live_verified":True,
              "action":x.get("action"),
              "update_verified":x.get("action")=="UPDATE",
              "create_verified":x.get("action")=="CREATE",
              "expected_title":x.get("expected_title"),
              "expected_meta_description":x.get("expected_meta_description"),
              "expected_h1":x.get("expected_h1"),
              "expected_cta_target":x.get("expected_cta_target"),
              "contract_hash":x.get("contract_hash"),
              "output_sha256":x.get("output_sha256"),
              "sitemap_required":os.environ.get("SITEMAP_REQUIRED")=="true",
              "sitemap_verified":os.environ.get("SITEMAP_VERIFIED")=="true",
              "sitemap_url":"https://readymaid.my/sitemap.xml",
              "sitemap_target":"https://readymaid.my"+x["target_url"],
              "pr_number":int("${{ steps.pr.outputs.pr_number }}"),
              "merge_sha":"${{ steps.merge.outputs.merge_sha }}",
              "gate_run_id":"${{ steps.gate.outputs.gate_run_id }}",
              "source_url":x.get("source_url") or x["target_url"],
              "target_url":x["target_url"],
              "anchor_text":x.get("anchor_text",""),
              "source_file":x.get("source_file") or x.get("target_file")
            }
          }
          print(json.dumps(payload))
          PY
          curl -fsS -X POST "$BROKER_URL"             -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json"             --data-binary @/tmp/finalize.json | tee /tmp/finalize-response.json
          touch /tmp/finalized

      - name: Fail closed if an active worker run did not reconcile
        if: always() && steps.lease.outputs.active == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [ -f /tmp/finalized ]; then exit 0; fi
          TOKEN=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${OIDC_AUD}" | python -c 'import json,sys; print(json.load(sys.stdin)["value"])')
          curl -fsS -X POST "$BROKER_URL" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            --data '{"action":"stage_state","run_id":"${{ steps.lease.outputs.run_id }}"}' > /tmp/stage-state.json || true

          python - <<'PY' >/tmp/fail.json
          import json, os
          ev={"protected_surface_ok":True}
          if os.path.exists('/tmp/seo-worker-result.json'):
              ev.update(json.load(open('/tmp/seo-worker-result.json')))
          failure={"class":"TRANSIENT","stage":"change_prepared","message":"worker failed before reconciliation"}
          if os.path.exists('/tmp/failure.json'):
              failure.update(json.load(open('/tmp/failure.json')))
          if os.path.exists('/tmp/stage-state.json'):
              try:
                  st=json.load(open('/tmp/stage-state.json'))
                  ev["resume_from"]=st.get("resume_from")
              except Exception:
                  pass
          pr_number="${{ steps.pr.outputs.pr_number }}"
          merge_sha="${{ steps.merge.outputs.merge_sha }}"
          gate_run_id="${{ steps.gate.outputs.gate_run_id }}"
          if pr_number.isdigit(): ev["pr_number"]=int(pr_number)
          if merge_sha: ev["merge_sha"]=merge_sha
          if gate_run_id: ev["gate_run_id"]=gate_run_id
          ev["live_verified"]=os.path.exists('/tmp/live-verified')
          external_error=str(failure.get("external_error") or "").strip()
          if external_error:
              ev["external_error"]=external_error
          error_message=str(failure["message"])
          if external_error:
              error_message=f"{error_message}: {external_error}"[:4000]
          print(json.dumps({
            "action":"finalize",
            "run_id":"${{ steps.lease.outputs.run_id }}",
            "result":"blocked",
            "failure_class":failure["class"],
            "stage":failure["stage"],
            "error_message":error_message,
            "evidence":ev
          }))
          PY
          curl -fsS -X POST "$BROKER_URL" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" --data-binary @/tmp/fail.json || true

