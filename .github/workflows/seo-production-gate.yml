name: SEO Production Gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-quality:
    name: Static quality and protected surface
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prove bounded SEO UPDATE executor
        run: node scripts/seo-update-worker-selftest.mjs
      - name: Prove deterministic SEO CREATE renderer
        run: node scripts/seo-create-renderer.mjs --self-test
      - name: Prove Meet DUKE guard rejects injected regressions
        run: node scripts/vercel-seo-guard.mjs --self-test
      - name: Verify cryptographic Meet DUKE baseline
        run: node scripts/vercel-seo-guard.mjs --ci
      - name: Audit sitemap pages, metadata, assets and links
        run: node scripts/seo-site-audit.mjs
      - name: Verify guide hub and sitemap synchronization
        run: python scripts/seo_surface_sync.py --check
      - name: Verify protected Meet DUKE remote media
        run: node scripts/check-duke-media.mjs

  rendered-screenshots:
    name: Desktop and mobile rendered evidence
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Start static QA server
        run: |
          node scripts/serve-static.mjs > /tmp/readymaid-seo-server.log 2>&1 &
          echo $! > /tmp/readymaid-seo-server.pid
          for attempt in {1..20}; do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:4173/ >/dev/null
      - name: Capture desktop and mobile Meet DUKE evidence
        run: |
          mkdir -p seo-qa-artifacts
          CHROME_BIN=$(command -v google-chrome || command -v google-chrome-stable)
          "$CHROME_BIN" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --virtual-time-budget=4000 --window-size=1440,1200 --screenshot=seo-qa-artifacts/meet-duke-desktop.png http://127.0.0.1:4173/#duke
          "$CHROME_BIN" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --virtual-time-budget=4000 --window-size=390,844 --screenshot=seo-qa-artifacts/meet-duke-mobile.png http://127.0.0.1:4173/#duke
          "$CHROME_BIN" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --virtual-time-budget=2500 --window-size=390,844 --screenshot=seo-qa-artifacts/guides-mobile.png http://127.0.0.1:4173/guides/
          test $(stat -c%s seo-qa-artifacts/meet-duke-desktop.png) -gt 10000
          test $(stat -c%s seo-qa-artifacts/meet-duke-mobile.png) -gt 10000
          test $(stat -c%s seo-qa-artifacts/guides-mobile.png) -gt 10000
      - uses: actions/upload-artifact@v4
        with:
          name: seo-rendered-evidence
          path: seo-qa-artifacts/*.png
          if-no-files-found: error
          retention-days: 30
